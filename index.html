<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List da Princesa</title>
  <style>
    :root {
      --primary: #8a2be2;
      --primary-light: #9d4edd;
      --secondary: #ff69b4;
      --accent: #ffd700;
      --light: #f8f4ff;
      --dark: #4b0082;
      --gray: #888;
      --danger: #ff4757;
      --success: #2ed573;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      padding: 20px;
      color: var(--dark);
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 500px;
      margin-top: 40px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--dark);
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .input-group {
      display: flex;
      margin-bottom: 20px;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.2);
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    button:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: var(--gray);
    }

    ul {
      list-style: none;
      margin-top: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
      transition: var(--transition);
      animation: fadeIn 0.3s ease;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #f9f9f9;
    }

    li:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    li.completed {
      text-decoration: line-through;
      color: var(--gray);
      background: #f0f0f0;
      opacity: 0.8;
    }

    .task-text {
      flex: 1;
      cursor: pointer;
      padding: 5px;
      border-radius: 4px;
      transition: var(--transition);
    }

    .task-text:hover {
      background: rgba(138, 43, 226, 0.1);
    }

    .task-actions {
      display: flex;
      gap: 10px;
    }

    .delete {
      color: var(--danger);
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete:hover {
      background: rgba(255, 71, 87, 0.1);
      transform: scale(1.1);
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--gray);
      display: none;
    }

    .empty-state.show {
      display: block;
    }

    .empty-state img {
      width: 100px;
      margin-bottom: 15px;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 20%, 60%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      80% { transform: translateY(-5px); }
    }

    .bounce {
      animation: bounce 0.6s;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 15px;
        margin-top: 20px;
      }
      
      h2 {
        font-size: 1.5rem;
      }
      
      .input-group {
        flex-direction: column;
      }
      
      button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>👑 To-Do List da Princesa</h2>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Adicione uma nova tarefa real..." aria-label="Nova tarefa">
      <button onclick="addTask()" id="addButton">
        <span>Adicionar</span>
      </button>
    </div>
    
    <div class="stats">
      <span id="totalTasks">Total: 0 tarefas</span>
      <span id="completedTasks">Concluídas: 0</span>
    </div>
    
    <ul id="taskList"></ul>
    
    <div class="empty-state" id="emptyState">
      <div>✨</div>
      <p>Nenhuma tarefa real por aqui!</p>
      <p>Adicione suas primeiras tarefas acima.</p>
    </div>
  </div>

  <script>
    // tarefas em localStorage 
    document.addEventListener('DOMContentLoaded', function() {
      loadTasks();
      updateStats();
      
      
      document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          addTask();
        }
      });
    });

    
    const initialTasks = [
      "Dar nomes novos pra cada um dos ratinhos 🐭💙",
      "Escrever novas histórias sobre Maui… e revisar as partes em que ele 'exagera'",
      "Visitar a Fada Madrinha e agradecer por tudo...",
      "Escovar o cabelo até o Pascal se cansar de contar 🦎💁‍♀️",
      "Levar a Luna a passear (minha rottweiler)",
      "Revisar documentos reais sem congelar a caneta",
      "Ajudar Charlotte a escolher vestido pra mais um baile <em>'sem motivo'</em> 👗🐸",
      "Parar com o hábito de comer comidas de estranhos que batem a porta 🍎❄️"
    ];

    function loadTasks() {
      const taskList = document.getElementById('taskList');
      const savedTasks = localStorage.getItem('princessTasks');
      
      if (savedTasks) {
        
        taskList.innerHTML = savedTasks;
      } else {
        
        initialTasks.forEach(task => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span class="task-text" onclick="toggleTask(this)">${task}</span>
            <div class="task-actions">
              <span class="delete" onclick="deleteTask(this)" aria-label="Excluir tarefa">✖</span>
            </div>
          `;
          taskList.appendChild(li);
        });
        saveTasks();
      }
      
      updateEmptyState();
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim();

      if (taskText === "") {
        input.focus();
        return;
      }

      const li = document.createElement('li');
      li.innerHTML = `
        <span class="task-text" onclick="toggleTask(this)">${taskText}</span>
        <div class="task-actions">
          <span class="delete" onclick="deleteTask(this)" aria-label="Excluir tarefa">✖</span>
        </div>
      `;

      document.getElementById('taskList').appendChild(li);
      input.value = "";
      input.focus();
      
      // Efeito visual ao adicionar
      li.classList.add('bounce');
      setTimeout(() => li.classList.remove('bounce'), 600);
      
      saveTasks();
      updateStats();
      updateEmptyState();
    }

    function toggleTask(element) {
      const li = element.parentElement;
      li.classList.toggle('completed');
      saveTasks();
      updateStats();
    }

    function deleteTask(element) {
      const li = element.closest('li');
      li.style.opacity = '0';
      li.style.transform = 'translateX(50px)';
      
      setTimeout(() => {
        li.remove();
        saveTasks();
        updateStats();
        updateEmptyState();
      }, 300);
    }

    function saveTasks() {
      const taskList = document.getElementById('taskList').innerHTML;
      localStorage.setItem('princessTasks', taskList);
    }

    function updateStats() {
      const totalTasks = document.querySelectorAll('#taskList li').length;
      const completedTasks = document.querySelectorAll('#taskList li.completed').length;
      
      document.getElementById('totalTasks').textContent = `Total: ${totalTasks} tarefa${totalTasks !== 1 ? 's' : ''}`;
      document.getElementById('completedTasks').textContent = `Concluídas: ${completedTasks}`;
    }

    function updateEmptyState() {
      const emptyState = document.getElementById('emptyState');
      const totalTasks = document.querySelectorAll('#taskList li').length;
      
      if (totalTasks === 0) {
        emptyState.classList.add('show');
      } else {
        emptyState.classList.remove('show');
      }
    }
  </script>
</body>
</html>
