<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/images/favicon.jpg" type="image/x-icon">
  <title>To-Do List da Princesa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/beleza.css">

</head>
<body>
  <div class="container">
    <div class="header">
      <h2><i class="fas fa-crown"></i> To-Do List da Princesa</h2>
      <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <i class="fas fa-moon"></i>
      </button>
    </div>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Adicione uma nova tarefa real..." aria-label="Nova tarefa">
      <button onclick="addTask()" id="addButton">
        <i class="fas fa-plus"></i>
        <span>Adicionar</span>
      </button>
    </div>
    
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar tarefas...">
    </div>
    
    <div class="controls">
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="setFilter('all')">Todas</button>
        <button class="filter-btn" onclick="setFilter('active')">Ativas</button>
        <button class="filter-btn" onclick="setFilter('completed')">Concluídas</button>
      </div>
      
      <div class="export-import">
        <button class="export-btn" onclick="exportTasks()">
          <i class="fas fa-download"></i>
          <span>Exportar</span>
        </button>
        <button class="import-btn" onclick="importTasks()">
          <i class="fas fa-upload"></i>
          <span>Importar</span>
        </button>
      </div>
    </div>
    
    <div class="stats">
      <span id="totalTasks">Total: 0 tarefas</span>
      <span id="completedTasks">Concluídas: 0</span>
    </div>
    
    <ul id="taskList"></ul>
    
    <div class="empty-state" id="emptyState">
      <i class="fas fa-magic"></i>
      <p>Nenhuma tarefa real por aqui!</p>
      <p>Adicione suas primeiras tarefas acima.</p>
    </div>
  </div>


  <script src="assets/js/cabeca.js"></script>

</body>
</html>
